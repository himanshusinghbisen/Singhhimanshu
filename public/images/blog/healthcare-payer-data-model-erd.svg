<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050">
<rect width="1600" height="1050" fill="#fbfaf6"/><text x="70" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18263b">Program-aware payer logical data model</text><text x="70" y="112" font-family="Arial,sans-serif" font-size="19" fill="#687386">Conceptual relationships; validate cardinality and mandatory rules against each product and jurisdiction.</text>
<defs><style>.box{fill:#fff;stroke:#8b9bb0;stroke-width:2;rx:14}.head{fill:#e7edf4}.t{font-family:Arial,sans-serif;font-size:20px;fill:#18263b;font-weight:700}.s{font-family:Arial,sans-serif;font-size:15px;fill:#596579}.line{stroke:#7890aa;stroke-width:3;fill:none}.dash{stroke:#bd8b48;stroke-width:3;stroke-dasharray:9 7;fill:none}</style></defs>
<g><rect class="box head" x="70" y="180" width="280" height="125"/><text class="t" x="95" y="220">Coverage Program</text><text class="s" x="95" y="255">Commercial / Medicare /</text><text class="s" x="95" y="280">Medicaid / Marketplace</text>
<rect class="box" x="410" y="180" width="280" height="125"/><text class="t" x="435" y="220">Program Variant</text><text class="s" x="435" y="255">MA / MCO / QHP / group</text><text class="s" x="435" y="280">Original Medicare / Part D</text>
<rect class="box" x="750" y="180" width="280" height="125"/><text class="t" x="775" y="220">Program Authority</text><text class="s" x="775" y="255">Federal / state / exchange</text><text class="s" x="775" y="280">Jurisdiction and rules</text>
<rect class="box head" x="1120" y="180" width="360" height="125"/><text class="t" x="1145" y="220">Plan / Product</text><text class="s" x="1145" y="255">Issuer or MCO product</text><text class="s" x="1145" y="280">Market, network, service area</text>
<path class="line" d="M350 242 H410 M690 242 H750 M1030 242 H1120"/>
<rect class="box" x="70" y="430" width="280" height="125"/><text class="t" x="95" y="470">Member</text><text class="s" x="95" y="505">Person / subscriber</text><text class="s" x="95" y="530">Stable person identifier</text>
<rect class="box head" x="410" y="430" width="280" height="125"/><text class="t" x="435" y="470">Eligibility Determination</text><text class="s" x="435" y="505">Category, outcome, source</text><text class="s" x="435" y="530">Decision + effective dates</text>
<rect class="box" x="750" y="430" width="280" height="125"/><text class="t" x="775" y="470">Program Participation</text><text class="s" x="775" y="505">Member ↔ program</text><text class="s" x="775" y="530">May overlap across programs</text>
<rect class="box head" x="1120" y="430" width="360" height="125"/><text class="t" x="1145" y="470">Program Enrollment</text><text class="s" x="1145" y="505">Member ↔ coverage arrangement</text><text class="s" x="1145" y="530">Plan, dates, status, source</text>
<path class="line" d="M350 492 H410 M690 492 H750 M1030 492 H1120"/><path class="dash" d="M210 305 V390 H550 V430 M550 305 V430 M890 305 V430 M1300 305 V430"/>
<rect class="box" x="220" y="700" width="300" height="125"/><text class="t" x="245" y="740">Carrier / Administrator</text><text class="s" x="245" y="775">Separate risk and service roles</text><text class="s" x="245" y="800">May be the same organization</text>
<rect class="box" x="650" y="700" width="300" height="125"/><text class="t" x="675" y="740">Benefit Configuration</text><text class="s" x="675" y="775">Plan-specific rules and limits</text><text class="s" x="675" y="800">Effective-dated configuration</text>
<rect class="box head" x="1080" y="700" width="300" height="125"/><text class="t" x="1105" y="740">Coordination of Benefits</text><text class="s" x="1105" y="775">Coverage-to-coverage relation</text><text class="s" x="1105" y="800">Payer order and responsibility</text>
<path class="line" d="M1300 555 V640 H800 V700 M800 555 V700 M1300 555 V640 H1230 V700 M350 555 V640 H370 V700"/>
<text x="70" y="930" font-family="Arial,sans-serif" font-size="19" fill="#596579">Dual eligibility is represented by concurrent Medicare and Medicaid participation records for the same member.</text><text x="70" y="965" font-family="Arial,sans-serif" font-size="19" fill="#596579">It is not a separate Coverage Program or a single boolean on Member.</text></svg>