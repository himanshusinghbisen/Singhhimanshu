<text x="130" y="285" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#18263b">From raw data to</text><text x="130" y="360" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#18263b">analysis-ready data</text>
<text x="132" y="420" font-family="Arial,sans-serif" font-size="27" fill="#596579">Profile · validate · clean · explore · transform</text>
