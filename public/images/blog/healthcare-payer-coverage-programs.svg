<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650">
<rect width="1500" height="650" fill="#fbfaf6"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#18263b">Coverage program contexts are different by design</text>
<g font-family="Arial,sans-serif"><rect x="60" y="130" width="310" height="250" rx="18" fill="#e8eef5" stroke="#7890aa" stroke-width="2"/><text x="90" y="185" font-size="28" font-weight="700" fill="#18263b">Commercial</text><text x="90" y="235" font-size="20" fill="#596579">Employer / group sponsor</text><text x="90" y="270" font-size="20" fill="#596579">Fully insured or self-funded</text><text x="90" y="305" font-size="20" fill="#596579">Group contract / plan docs</text>
<rect x="410" y="130" width="310" height="250" rx="18" fill="#e8eef5" stroke="#7890aa" stroke-width="2"/><text x="440" y="185" font-size="28" font-weight="700" fill="#18263b">Medicare</text><text x="440" y="235" font-size="20" fill="#596579">Federal program authority</text><text x="440" y="270" font-size="20" fill="#596579">Original / MA / Part D</text><text x="440" y="305" font-size="20" fill="#596579">Private MA organization</text>
<rect x="760" y="130" width="310" height="250" rx="18" fill="#e8eef5" stroke="#7890aa" stroke-width="2"/><text x="790" y="185" font-size="28" font-weight="700" fill="#18263b">Medicaid</text><text x="790" y="235" font-size="20" fill="#596579">Federal-state program</text><text x="790" y="270" font-size="20" fill="#596579">State agency / jurisdiction</text><text x="790" y="305" font-size="20" fill="#596579">FFS and managed care</text>
<rect x="1110" y="130" width="330" height="250" rx="18" fill="#e8eef5" stroke="#7890aa" stroke-width="2"/><text x="1140" y="185" font-size="28" font-weight="700" fill="#18263b">Marketplace</text><text x="1140" y="235" font-size="20" fill="#596579">Exchange enrollment channel</text><text x="1140" y="270" font-size="20" fill="#596579">QHP issuer offers coverage</text><text x="1140" y="305" font-size="20" fill="#596579">PTC / CSR assistance</text>
<rect x="330" y="465" width="840" height="115" rx="20" fill="#f6e9d4" stroke="#bd8b48" stroke-width="2"/><text x="750" y="510" font-size="27" font-weight="700" text-anchor="middle" fill="#744d1d">Dual eligibility = overlapping Medicare + Medicaid participation</text><text x="750" y="548" font-size="20" text-anchor="middle" fill="#744d1d">One member · distinct eligibility categories · potentially separate enrollment and payers</text></g></svg>